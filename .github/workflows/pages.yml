name: Deploy GitHub Pages

# หน้าเว็บโหลดข้อมูลสดจาก สนน. ในเบราว์เซอร์ของผู้ชมเอง (iframe + รูปภาพ)
# จึง deploy แค่ตอนแก้โค้ด ไม่ต้องตั้งเวลาดึงข้อมูล
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python build_static.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
