name: อัปเดตหน้าระดับน้ำคลองประเวศ (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"   # ทุก 10 นาที (GitHub อาจหน่วงเวลาจริงไปบ้าง)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ดึงข้อมูลจาก สนน. และสร้างเว็บ
        run: python build_static.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
